<template>
    <lightning-card title="My Leads" icon-name="standard:lead">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>
        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">Unable to load leads.</div>
        </template>
        <template if:true={isEmpty}>
            <div class="slds-p-around_medium slds-text-color_weak">
                You haven't submitted any leads yet.
            </div>
        </template>
        <template lwc:if={rows.length}>
            <div class="slds-p-horizontal_small">
                <lightning-datatable
                    key-field="id"
                    data={rows}
                    columns={columns}
                    onrowaction={handleRowAction}
                    hide-checkbox-column
                    show-row-number-column>
                </lightning-datatable>
            </div>
        </template>
    </lightning-card>
</template>
