<template>
    <lightning-card title="Inventory Summary" icon-name="standard:reward">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading inventory" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">Unable to load inventory.</div>
        </template>

        <template if:true={isEmpty}>
            <div class="slds-p-around_medium slds-text-color_weak">No units in this project yet.</div>
        </template>

        <template lwc:if={segments.length}>
            <div class="slds-grid slds-gutters slds-p-around_medium">
                <div class="slds-col slds-size_1-of-2 slds-align_absolute-center">
                    <div class="donut-wrapper">
                        <svg viewBox="0 0 42 42" width="180" height="180" class="donut">
                            <circle cx="21" cy="21" r="15.91549430918954"
                                    fill="transparent" stroke="#e0e0e0" stroke-width="3"></circle>
                            <template for:each={segments} for:item="s">
                                <circle key={s.key}
                                        cx="21" cy="21" r="15.91549430918954"
                                        fill="transparent" stroke-width="3"
                                        style={s.style}></circle>
                            </template>
                            <text x="21" y="20" text-anchor="middle" class="donut-pct">{sellThroughDisplay}</text>
                            <text x="21" y="25" text-anchor="middle" class="donut-label">Sold</text>
                        </svg>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <ul class="slds-has-dividers_bottom">
                        <template for:each={legend} for:item="row">
                            <li key={row.key} class="slds-item slds-grid slds-grid_vertical-align-center slds-p-vertical_x-small">
                                <span class="legend-dot" style={row.dotStyle}></span>
                                <span class="slds-text-body_regular slds-grow">&nbsp;{row.label}</span>
                                <strong>{row.count}</strong>
                            </li>
                        </template>
                    </ul>
                    <div class="slds-text-title slds-text-color_weak slds-p-top_small slds-text-align_right">
                        Total Units: {data.totalUnits}
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
