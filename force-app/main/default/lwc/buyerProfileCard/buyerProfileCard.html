<template>
    <lightning-card title="Buyer Profile" icon-name="standard:person_account">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading profile" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">Unable to load buyer profile.</div>
        </template>

        <template if:true={data}>
            <div class="slds-p-around_medium">
                <div class="slds-text-heading_medium">{data.name}</div>
                <div class="slds-grid slds-grid_vertical-align-center slds-m-top_x-small">
                    <span class="slds-m-right_x-small">
                        <lightning-badge label={kycLabel} variant={kycVariant}></lightning-badge>
                    </span>
                    <template lwc:if={isNri}>
                        <span class="slds-m-right_x-small">
                            <lightning-badge label="NRI"></lightning-badge>
                        </span>
                    </template>
                    <template lwc:if={data.buyerType}>
                        <span class="slds-text-body_small slds-text-color_weak">&middot;&nbsp;{data.buyerType}</span>
                    </template>
                </div>
            </div>

            <div class="slds-grid slds-gutters slds-p-horizontal_medium slds-p-bottom_small slds-border_top slds-p-top_small">
                <div class="slds-col slds-size_1-of-2">
                    <div class="slds-text-title slds-text-color_weak">PAN</div>
                    <div class="slds-text-body_regular pan-mono">{maskedPan}</div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class="slds-text-title slds-text-color_weak">Date of Birth</div>
                    <div class="slds-text-body_regular">{dobDisplay}</div>
                </div>
            </div>

            <div class="slds-p-around_medium slds-border_top slds-text-align_center">
                <div class="slds-text-title slds-text-color_weak">Investment Footprint</div>
                <div class="slds-text-heading_small">{bookingsLine}</div>
            </div>
        </template>
    </lightning-card>
</template>
