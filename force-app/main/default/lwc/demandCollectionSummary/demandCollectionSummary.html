<template>
    <lightning-card title="Collection Summary" icon-name="standard:currency">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading collections" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-p-around_medium slds-text-color_error">Unable to load collection data.</div>
        </template>

        <template if:true={isEmpty}>
            <div class="slds-p-around_medium slds-text-color_weak">
                No demands raised yet for this booking.
            </div>
        </template>

        <template lwc:if={data.demandCount}>
            <div class="slds-grid slds-gutters slds-p-around_medium">
                <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                    <div class="slds-text-title slds-text-color_weak">Total Demanded</div>
                    <div class="slds-text-heading_medium">{totalDemanded}</div>
                </div>
                <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                    <div class="slds-text-title slds-text-color_weak">Received</div>
                    <div class="slds-text-heading_medium slds-text-color_success">{totalReceived}</div>
                </div>
                <div class="slds-col slds-size_1-of-3 slds-text-align_center">
                    <div class="slds-text-title slds-text-color_weak">Outstanding</div>
                    <div class="slds-text-heading_medium slds-text-color_destructive">{outstanding}</div>
                </div>
            </div>

            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <div class="progress-track">
                    <div class="progress-fill" style={progressStyle}></div>
                </div>
                <div class="slds-text-title slds-text-color_weak slds-p-top_x-small slds-text-align_center">
                    {progressLabel} &middot; {countSummary}
                </div>
            </div>
        </template>
    </lightning-card>
</template>
